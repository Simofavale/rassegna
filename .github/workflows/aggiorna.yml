name: Aggiorna notizie

on:
  # L'orario programmato di GitHub è inaffidabile (spesso non parte): resta solo come riserva.
  # Il ritmo vero lo dà il job "prossimo" in fondo, che a fine giro riavvia questo workflow.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:          # avvio manuale e catena automatica
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # cache delle traduzioni tra un'esecuzione e l'altra: si traducono solo gli articoli nuovi
      - name: Ripristina traduzioni
        uses: actions/cache/restore@v4
        with:
          path: data/translations.json
          key: translations-${{ github.run_id }}
          restore-keys: translations-

      - name: Scarica, traduci e genera il sito
        run: node server.js --build _site
        env:
          RASSEGNA_KEY: ${{ secrets.RASSEGNA_KEY }}

      - name: Salva traduzioni
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/translations.json
          key: translations-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Catena: aspetta ~12 minuti e fa partire il prossimo aggiornamento (anche se questo giro è fallito).
  # Se c'è già un altro giro in coda o in corso, non ne avvia un secondo.
  prossimo:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Attendi
        run: sleep 720
      - name: Avvia il prossimo aggiornamento
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          altri=$(gh run list --repo "$REPO" --workflow aggiorna.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\")] | length")
          echo "altri giri attivi: $altri"
          if [ "$altri" = "0" ]; then gh workflow run aggiorna.yml --repo "$REPO" --ref main; fi
