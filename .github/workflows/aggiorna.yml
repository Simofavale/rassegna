name: Aggiorna notizie

on:
  # L'orario programmato di GitHub è inaffidabile (spesso non parte): resta solo come riserva.
  # Il ritmo vero lo dà il job "prossimo" in fondo, che a fine giro riavvia questo workflow.
  # Il pulsante ↻ dell'app avvia subito un giro con workflow_dispatch.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # un solo giro di generazione alla volta; quelli nuovi aspettano (non vengono annullati)
    concurrency:
      group: rassegna-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # cache delle traduzioni tra un'esecuzione e l'altra: si traducono solo gli articoli nuovi
      - name: Ripristina traduzioni
        uses: actions/cache/restore@v4
        with:
          path: data/translations.json
          key: translations-${{ github.run_id }}
          restore-keys: translations-

      - name: Scarica, traduci e genera il sito
        run: node server.js --build _site
        env:
          RASSEGNA_KEY: ${{ secrets.RASSEGNA_KEY }}

      - name: Salva traduzioni
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/translations.json
          key: translations-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: rassegna-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Catena: aspetta ~12 minuti e fa partire il prossimo aggiornamento (anche se questo giro è fallito).
  # Non occupa la coda di generazione, quindi un aggiornamento chiesto dall'app parte subito.
  # Se nel frattempo è partito un giro più recente (es. dal pulsante ↻), lascia proseguire quello.
  prossimo:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Attendi
        run: sleep 720
      - name: Avvia il prossimo aggiornamento
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ME: ${{ github.run_id }}
        run: |
          piu_recenti=$(gh run list --repo "$REPO" --workflow aggiorna.yml --limit 20 --json databaseId \
            --jq "[.[] | select(.databaseId > $ME)] | length")
          echo "giri più recenti di questo: $piu_recenti"
          if [ "$piu_recenti" = "0" ]; then gh workflow run aggiorna.yml --repo "$REPO" --ref main; fi
